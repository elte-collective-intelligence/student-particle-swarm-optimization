# Dynamics curriculum: static sphere → slow dynamics (shift=0.05) → fast dynamics (shift=0.3)
# Tests whether training on non-stationary landscapes transfers to unseen dynamics.

curriculum:
  type: dynamics
  window: 10

seeds: [42, 43, 44, 45, 46]

model:
  hidden_size: 64
  learning_rate: 3e-4

env:
  num_agents: 50
  batch_size: 8
  delta: 1.0

frames_per_batch: 4096
minibatch_size: 512
num_epochs: 5
max_grad_norm: 0.5
clip_epsilon: 0.2
entropy_coef: 0.02    # slightly higher — non-stationary tasks need more exploration
gamma: 0.99
lmbda: 0.95

run_generalization: true
n_eval_episodes: 10
run_baseline_comparison: true
run_domain_rand: true

output_dir: src/outputs/curriculum/dynamics
