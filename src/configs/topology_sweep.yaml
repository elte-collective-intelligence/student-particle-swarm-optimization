# Full Task 1 topology sweep.
# Runs 4 topologies x 3 landscapes x 5 seeds by default.
# Usage:
#   python src/eval_multi_topology.py --config-name topology_sweep
#   python src/eval_multi_topology.py --config-name topology_sweep eval.num_eval_episodes=3 eval.max_steps=50

hydra:
  run:
    dir: src/outputs/topology_sweep/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: src/outputs/topology_sweep/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}

model:
  name: ppo
  hidden_sizes: [64, 64]
  activation: relu
  dropout: 0.25
  learning_rate: 0.0001
  centralized_critic: true
  share_params: true

env:
  name: swarm
  landscape_dim: 2
  num_agents: 10
  batch_size: 1
  delta: 1.0

eval:
  num_eval_episodes: 5
  max_steps: 100
  save_metrics: true
  compare_random: true
  collect_diversity: true
  collect_info_spread: true

landscapes:
  - sphere
  - rastrigin
  - dynamic_sphere

seeds: [0, 1, 2, 3, 4]

topologies:
  - name: global
    type: global
    include_self: true

  - name: ring
    type: ring
    k: 1
    include_self: true

  - name: von_neumann
    type: von_neumann
    rows: null
    cols: null
    include_self: true

  - name: knearest
    type: knearest
    k: 2
    recompute_interval: 5
    symmetric: true
    include_self: true

model_path: src/outputs/full_train/best_model.pt
output_dir: src/outputs/topology_sweep
